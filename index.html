<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
<h1>Rock Paper Scissors</h1>
<div class="wrapper">
    <div id="btnChoices">
        <button>Rock</button>
        <button>Paper</button>
        <button>Scissors</button>
    </div>
    <div id="gameResult">Welcome!</div>
    <h1 id="gameAnnouncer"></h1>
    <hr>
</div>
<div class="wrapper">
    <h2 id="gameStatus">Player 0, Computer 0</h2>
    <button id="btnReset">Reset Game</button>
</div>

<h2>Game History: <span id="gameLimit"></span></h2>
<ul id="gameLog"></ul>

</body>
</html>
